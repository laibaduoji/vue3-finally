<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      button {
        color: red;
      }
    </style>
  </head>
  <body>
    <my-button></my-button>
  </body>
  <script>
    class MyButton extends HTMLElement {
      constructor() {
        super();
        this.attachShadow({ mode: "open" }); // 创建 Shadow DOM
        this.shadowRoot.innerHTML = `
      <style>
        button {
          background: blue;
          color: white;
          padding: 10px 20px;
          border: none;
          cursor: pointer;
        }
      </style>
      <button>点击我</button>
    `;
      }
    }

    // 注册自定义元素
    customElements.define("my-button", MyButton);
  </script>
</html>
