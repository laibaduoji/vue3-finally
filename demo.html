<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Document</title>
	</head>
	<body></body>
	<script>
		function sleep() {
			return new Promise((resolve, reject) => {
				setTimeout(() => {
					resolve("sleep end");
				}, 1500);
			});
		}

		async function fun() {
			console.log(1);
			await sleep().then((res) => {
				console.log(res);
			});

			console.log(2);
		}

		fun();
	</script>
</html>
